<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3a2020"/>
      <stop offset="45%"  stop-color="#6b3a3a"/>
      <stop offset="100%" stop-color="#9b5a5a"/>
    </linearGradient>

    <!-- Gold shimmer -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a96e"/>
      <stop offset="50%"  stop-color="#e8d5a0"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>

    <!-- Soft glow -->
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%"   stop-color="#e8a4a4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3a2020" stop-opacity="0"/>
    </radialGradient>

    <!-- Petal drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a0a0a" flood-opacity="0.35"/>
    </filter>

    <!-- Text shadow -->
    <filter id="textshadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1a0a0a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- Decorative circles (depth) -->
  <circle cx="520" cy="80"  r="120" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="520" cy="80"  r="80"  fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="120" cy="290" r="100" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="320" cy="180" r="220" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Scattered petals — large background flowers -->
  <!-- Top right cluster -->
  <text x="500" y="90"  font-size="70" opacity="0.12" filter="url(#shadow)">🌸</text>
  <text x="560" y="50"  font-size="44" opacity="0.10" filter="url(#shadow)">🌹</text>
  <text x="580" y="130" font-size="36" opacity="0.08">🌺</text>

  <!-- Bottom left cluster -->
  <text x="20"  y="330" font-size="60" opacity="0.12" filter="url(#shadow)">💐</text>
  <text x="60"  y="290" font-size="36" opacity="0.08">🌷</text>
  <text x="-10" y="260" font-size="28" opacity="0.06">🌸</text>

  <!-- Top left -->
  <text x="30"  y="80"  font-size="32" opacity="0.07">🌼</text>
  <text x="70"  y="50"  font-size="22" opacity="0.06">🪻</text>

  <!-- Bottom right -->
  <text x="580" y="340" font-size="40" opacity="0.08">🌻</text>
  <text x="610" y="290" font-size="24" opacity="0.06">🌷</text>

  <!-- Gold decorative line top -->
  <rect x="40" y="28" width="560" height="1" fill="url(#gold)" opacity="0.4"/>
  <!-- Gold decorative line bottom -->
  <rect x="40" y="331" width="560" height="1" fill="url(#gold)" opacity="0.4"/>

  <!-- Corner ornaments -->
  <text x="28" y="26"  font-size="14" fill="#c9a96e" opacity="0.7">✦</text>
  <text x="600" y="26" font-size="14" fill="#c9a96e" opacity="0.7">✦</text>
  <text x="28" y="348" font-size="14" fill="#c9a96e" opacity="0.7">✦</text>
  <text x="600" y="348" font-size="14" fill="#c9a96e" opacity="0.7">✦</text>

  <!-- Main center flower -->
  <text x="320" y="148" font-size="64" text-anchor="middle" filter="url(#shadow)" opacity="0.95">🌸</text>

  <!-- Brand name -->
  <text
    x="320" y="210"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="400"
    fill="white"
    text-anchor="middle"
    letter-spacing="6"
    filter="url(#textshadow)"
  >ZOHA FLOWERS</text>

  <!-- Gold divider -->
  <line x1="220" y1="226" x2="420" y2="226" stroke="url(#gold)" stroke-width="1" opacity="0.8"/>
  <circle cx="320" cy="226" r="3" fill="#c9a96e" opacity="0.9"/>

  <!-- Tagline -->
  <text
    x="320" y="252"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="13"
    font-weight="300"
    fill="#e8d5b0"
    text-anchor="middle"
    letter-spacing="4"
    opacity="0.9"
  >PREMIUM FLOWER BOUTIQUE</text>

  <!-- 24/7 badge -->
  <rect x="245" y="276" width="150" height="30" rx="15" fill="rgba(255,255,255,0.10)" stroke="#c9a96e" stroke-width="1" opacity="0.85"/>
  <text
    x="320" y="296"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="12"
    font-weight="600"
    fill="#e8d5b0"
    text-anchor="middle"
    letter-spacing="2"
  >● 24/7 DELIVERY</text>

  <!-- Bottom contact -->
  <text
    x="320" y="338"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="11"
    fill="#c9a96e"
    text-anchor="middle"
    letter-spacing="1.5"
    opacity="0.8"
  >@Zoxaflowers  •  +998 94 487 00 97</text>
</svg>
